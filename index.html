<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AXY - Easy Task Grab Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #05040a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #ffffff;
      overflow-x: hidden;
      perspective: 1200px;
    }

    /* Dark Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(40, 25, 80, 0.5), rgba(5, 4, 10, 0.92));
      backdrop-filter: blur(8px);
      z-index: 1;
    }

    /* Ambient Glow */
    body::before {
      content: '';
      position: fixed;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, rgba(234, 179, 8, 0.12) 40%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
      animation: ambientPulse 5s ease-in-out infinite;
    }

    @keyframes ambientPulse {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* Main Card */
    .card {
      position: relative;
      background: linear-gradient(165deg, rgba(28, 24, 48, 0.97), rgba(12, 10, 22, 0.98));
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 30px;
      width: 100%;
      max-width: 360px;
      padding: 36px 22px 28px;
      text-align: center;
      backdrop-filter: blur(24px);
      z-index: 10;
      transform-style: preserve-3d;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 0 80px rgba(168, 85, 247, 0.15),
        0 0 40px rgba(234, 179, 8, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: popupIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      transform: scale(0.7) translateY(40px) rotateX(8deg);
    }

    @keyframes popupIn {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(40px) rotateX(8deg);
      }
      70% {
        opacity: 1;
        transform: scale(1.04) translateY(-10px) rotateX(-2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotateX(0);
      }
    }

    .card:hover {
      transform: translateY(-12px) rotateX(6deg) rotateY(-5deg) scale(1.02);
      box-shadow: 
        0 45px 80px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 0 100px rgba(168, 85, 247, 0.25),
        0 0 50px rgba(234, 179, 8, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* Floating Badge */
    .floating-popup {
      position: absolute;
      top: -15px;
      right: 18px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 13px;
      border-radius: 50px;
      box-shadow: 
        0 8px 20px rgba(34, 197, 94, 0.45),
        0 0 15px rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
      transform: translateZ(40px);
      animation: floatPopup 3s ease-in-out infinite;
    }

    @keyframes floatPopup {
      0%, 100% { transform: translateY(0) translateZ(40px); }
      50% { transform: translateY(-6px) translateZ(40px); }
    }

    .floating-popup span {
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px #fff;
      animation: blink 1.5s infinite;
    }

    /* Avatar */
    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 24px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6, #06b6d4, #f59e0b);
      background-size: 300% 300%;
      animation: gradientShift 5s ease infinite;
      box-shadow: 
        0 20px 45px rgba(139, 92, 246, 0.5),
        0 0 0 8px rgba(139, 92, 246, 0.12),
        0 0 40px rgba(236, 72, 153, 0.3),
        0 0 80px rgba(245, 158, 11, 0.15);
      transform: translateZ(50px);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #0f0e17;
      border: 4px solid #0f0e17;
    }

    .avatar-wrapper::before {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1.5px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
      animation: pulseRing 2.5s ease-in-out infinite;
    }

    .avatar-wrapper::after {
      content: '';
      position: absolute;
      inset: -28px;
      border-radius: 50%;
      border: 1px solid rgba(245, 158, 11, 0.2);
      animation: pulseRing 2.5s ease-in-out infinite 0.4s;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 0.2; }
    }

    /* Status Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(234, 179, 8, 0.1));
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.45);
      padding: 7px 16px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      text-transform: uppercase;
      box-shadow: 
        0 6px 18px rgba(245, 158, 11, 0.25),
        0 0 20px rgba(245, 158, 11, 0.1);
      transform: translateZ(30px);
    }

    .badge span {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 12px #22c55e, 0 0 4px #22c55e;
      animation: blink 1.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 25px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transform: translateZ(35px);
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 26px;
      padding: 0 4px;
      transform: translateZ(20px);
    }

    /* Start Task CTA Button */
    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 18px;
      background: linear-gradient(135deg, #facc15 0%, #eab308 45%, #ca8a04 100%);
      color: #000000;
      font-size: 15.5px;
      font-weight: 800;
      text-decoration: none;
      border-radius: 16px;
      letter-spacing: 0.3px;
      border: none;
      cursor: pointer;
      overflow: hidden;
      transform: translateZ(45px);
      box-shadow: 
        0 12px 28px rgba(234, 179, 8, 0.45),
        0 5px 0 #a16207,
        0 0 30px rgba(234, 179, 8, 0.2),
        inset 0 2px 0 rgba(255, 255, 255, 0.45);
      transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .cta-btn:hover {
      transform: translateZ(45px) translateY(-5px) scale(1.03);
      box-shadow: 
        0 18px 36px rgba(234, 179, 8, 0.55),
        0 7px 0 #a16207,
        0 0 40px rgba(234, 179, 8, 0.3),
        inset 0 2px 0 rgba(255, 255, 255, 0.55);
      background: linear-gradient(135deg, #fde047 0%, #facc15 45%, #eab308 100%);
    }

    .cta-btn:active {
      transform: translateZ(45px) translateY(3px) scale(0.98);
      box-shadow: 
        0 6px 16px rgba(234, 179, 8, 0.35),
        0 2px 0 #a16207,
        inset 0 2px 0 rgba(255, 255, 255, 0.3);
    }

    .cta-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: skewX(-20deg);
      transition: 0.55s;
    }

    .cta-btn:hover::before {
      left: 140%;
    }

    .cta-btn svg {
      width: 22px;
      height: 22px;
      fill: #000000;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
      transform: translateZ(15px);
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="card">
    <div class="floating-popup">
      <span></span> New Task
    </div>

    <div class="avatar-wrapper">
      <img src="dp.jpg" alt="AXY Logo" class="avatar-img" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80'">
    </div>

    <div class="badge">
      <span></span> Active Task Available
    </div>

    <h1>Easy Task Grab Now</h1>
    <p class="subtitle">Click below to start your task directly on Telegram and get your details instantly.</p>

    <!-- Start Task Button with Bot Auto-Start -->
    <a href="https://t.me/Agent_alinaNSE_bot?start=start" class="cta-btn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
      </svg>
      Start Task Now
    </a>

    <div class="footer-note">
      Fast & direct verification
    </div>
  </div>

  <!-- Aesthetic Ambient Sound Generator (Web Audio API - No external mp3 required) -->
  <script>
    let soundPlayed = false;

    function playAestheticSound() {
      if (soundPlayed) return;
      soundPlayed = true;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();

        // Aesthetic Crystal Chord: F# Minor / Major ambient wash (Harmonious & Chill)
        const notes = [
          { f: 554.37, d: 0.0, l: 1.8 }, // C#5
          { f: 659.25, d: 0.15, l: 2.0 }, // E5
          { f: 880.00, d: 0.32, l: 2.2 }, // A5
          { f: 1108.73, d: 0.48, l: 2.5 } // C#6
        ];

        notes.forEach(n => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(n.f, ctx.currentTime + n.d);

          // Smooth fade-in & soft decay
          gain.gain.setValueAtTime(0.0001, ctx.currentTime + n.d);
          gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + n.d + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + n.d + n.l);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + n.d);
          osc.stop(ctx.currentTime + n.d + n.l);
        });
      } catch (err) {
        console.log("Audio waiting for user gesture", err);
      }
    }

    // Attempt direct play on load, fallback to first touch/click (browser policy)
    window.addEventListener('load', playAestheticSound);
    window.addEventListener('pointerdown', playAestheticSound, { once: true });
    window.addEventListener('scroll', playAestheticSound, { once: true });
  </script>

</body>
</html>
