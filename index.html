<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AXY - Easy Task Grab Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #05040a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #ffffff;
      overflow-x: hidden;
      perspective: 1000px;
      position: relative;
    }

    /* Ambient Glow Background */
    .ambient-glow {
      position: fixed;
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(234, 179, 8, 0.12) 45%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(65px);
      z-index: 0;
      pointer-events: none;
      animation: pulseGlow 5s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* 3D Glass Card */
    .card {
      position: relative;
      background: linear-gradient(170deg, rgba(30, 24, 52, 0.95) 0%, rgba(13, 11, 24, 0.98) 100%);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 30px;
      width: 100%;
      max-width: 350px;
      padding: 36px 22px 28px;
      text-align: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 10;
      transform-style: preserve-3d;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.85),
        0 0 60px rgba(168, 85, 247, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: transform 0.25s ease-out;
    }

    /* Floating Status Badge */
    .floating-popup {
      position: absolute;
      top: -14px;
      right: 18px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .floating-popup span {
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
    }

    /* 3D Avatar Glow */
    .avatar-wrapper {
      position: relative;
      width: 136px;
      height: 136px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6, #06b6d4, #f59e0b);
      background-size: 300% 300%;
      animation: shiftGrad 5s linear infinite;
      box-shadow: 0 18px 40px rgba(139, 92, 246, 0.5);
    }

    @keyframes shiftGrad {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #0f0e17;
      border: 3.5px solid #0f0e17;
    }

    /* Active Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.45);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .badge span {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 12px #22c55e;
    }

    h1 {
      font-size: 25px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 26px;
      padding: 0 4px;
    }

    /* Start Task 3D Golden CTA Button */
    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 18px;
      background: linear-gradient(135deg, #fde047 0%, #eab308 55%, #ca8a04 100%);
      color: #000000;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      border-radius: 18px;
      box-shadow: 
        0 14px 28px rgba(234, 179, 8, 0.45),
        0 5px 0 #a16207,
        inset 0 1.5px 0 rgba(255, 255, 255, 0.6);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .cta-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 10px rgba(234, 179, 8, 0.35), 0 1px 0 #a16207;
    }

    .cta-btn svg {
      width: 22px;
      height: 22px;
      fill: #000000;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="card" id="card">
    <div class="floating-popup">
      <span></span> New Task
    </div>

    <div class="avatar-wrapper">
      <img src="dp.jpg" alt="Logo" class="avatar-img" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80'">
    </div>

    <div class="badge">
      <span></span> Active Task Available
    </div>

    <h1>Easy Task Grab Now</h1>
    <p class="subtitle">Click below to start your task directly on Telegram and get your details instantly.</p>

    <!-- Auto start bot URL -->
    <a href="https://t.me/Agent_alinaNSE_bot?start=start" class="cta-btn" id="taskBtn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
      </svg>
      Start Task Now
    </a>

    <div class="footer-note">
      Fast & direct verification
    </div>
  </div>

  <script>
    // Calm, Gentle Ambient Bell Sound Engine (Soft Lo-Fi Chime)
    let audioPlayed = false;

    function playSoftCalmSound() {
      if (audioPlayed) return;
      audioPlayed = true;

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();

        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        // F-Major Chill Harmonic Notes (Soft, Warm, Meditative)
        const notes = [
          { freq: 349.23, delay: 0.0, decay: 2.8, gain: 0.12 }, // F4
          { freq: 523.25, delay: 0.16, decay: 3.0, gain: 0.10 }, // C5
          { freq: 698.46, delay: 0.32, decay: 3.2, gain: 0.08 }, // F5
          { freq: 880.00, delay: 0.48, decay: 3.5, gain: 0.06 }  // A5
        ];

        notes.forEach(n => {
          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();

          osc.type = 'sine'; // Pure soft waveform
          osc.frequency.setValueAtTime(n.freq, ctx.currentTime + n.delay);

          // Smooth gentle attack & long fading decay
          gainNode.gain.setValueAtTime(0.0001, ctx.currentTime + n.delay);
          gainNode.gain.linearRampToValueAtTime(n.gain, ctx.currentTime + n.delay + 0.1);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + n.delay + n.decay);

          osc.connect(gainNode);
          gainNode.connect(ctx.destination);

          osc.start(ctx.currentTime + n.delay);
          osc.stop(ctx.currentTime + n.delay + n.decay + 0.1);
        });
      } catch (err) {
        console.warn("Audio Context unlock waiting for tap:", err);
      }
    }

    // Touch, click or scroll anywhere on screen immediately unlocks and plays calm sound
    window.addEventListener('touchstart', playSoftCalmSound, { passive: true, once: true });
    window.addEventListener('pointerdown', playSoftCalmSound, { once: true });
    window.addEventListener('click', playSoftCalmSound, { once: true });
    window.addEventListener('scroll', playSoftCalmSound, { once: true });

    // 3D Card Gyro Touch Tilt
    const cardEl = document.getElementById('card');
    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const rotateX = (window.innerHeight / 2 - touch.clientY) / 24;
      const rotateY = (touch.clientX - window.innerWidth / 2) / 24;
      cardEl.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      cardEl.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });
  </script>

</body>
</html>
