<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AXY - Easy Task Grab Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #05040a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      color: #ffffff;
      overflow-x: hidden;
      perspective: 1000px;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.28) 0%, rgba(234, 179, 8, 0.15) 45%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(55px);
      z-index: 0;
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* 3D Glass Card */
    .card {
      position: relative;
      background: linear-gradient(165deg, rgba(28, 24, 48, 0.95), rgba(12, 10, 22, 0.98));
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 28px;
      width: 100%;
      max-width: 350px;
      padding: 34px 22px 26px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.85),
        0 0 50px rgba(168, 85, 247, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transform-style: preserve-3d;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Floating Status Badge */
    .floating-popup {
      position: absolute;
      top: -14px;
      right: 18px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.5);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
    }

    .floating-popup span {
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffffff;
    }

    /* 3D Avatar Glow */
    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6, #06b6d4, #f59e0b);
      background-size: 300% 300%;
      animation: gradientRotate 4s linear infinite;
      box-shadow: 0 15px 35px rgba(139, 92, 246, 0.45);
    }

    @keyframes gradientRotate {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #0f0e17;
      border: 3px solid #0f0e17;
    }

    /* Active Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .badge span {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    /* Start Task 3D Button */
    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 18px;
      background: linear-gradient(135deg, #facc15 0%, #eab308 50%, #ca8a04 100%);
      color: #000000;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 
        0 10px 24px rgba(234, 179, 8, 0.45),
        0 4px 0 #a16207;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cta-btn:active {
      transform: translateY(3px);
      box-shadow: 0 4px 10px rgba(234, 179, 8, 0.35), 0 1px 0 #a16207;
    }

    .cta-btn svg {
      width: 22px;
      height: 22px;
      fill: #000000;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="card" id="mainCard">
    <div class="floating-popup">
      <span></span> New Task
    </div>

    <div class="avatar-wrapper">
      <img src="dp.jpg" alt="Task Logo" class="avatar-img" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80'">
    </div>

    <div class="badge">
      <span></span> Active Task Available
    </div>

    <h1>Easy Task Grab Now</h1>
    <p class="subtitle">Click below to start your task directly on Telegram and get your details instantly.</p>

    <!-- Auto start bot link -->
    <a href="https://t.me/Agent_alinaNSE_bot?start=start" class="cta-btn" id="taskLink" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
      </svg>
      Start Task Now
    </a>

    <div class="footer-note">
      Fast & direct verification
    </div>
  </div>

  <script>
    // 3D Card Gyroscope / Tilt Effect on Mobile Touch & Move
    const card = document.getElementById('mainCard');
    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const x = (window.innerWidth / 2 - touch.clientX) / 25;
      const y = (window.innerHeight / 2 - touch.clientY) / 25;
      card.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      card.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });

    // High Clarity Aesthetic Chime Sound (Zero external files, 100% Chrome compatible)
    let audioPlayed = false;
    function playAestheticAudio() {
      if (audioPlayed) return;
      audioPlayed = true;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();

        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        // Dreamy aesthetic bell chords (C5, G5, E6)
        const notes = [523.25, 783.99, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);

          gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + idx * 0.12 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.12 + 1.8);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 1.9);
        });
      } catch (err) {
        console.warn(err);
      }
    }

    // Chrome audio policy: Touch/tap/scroll anywhere triggers crystal audio instantly
    window.addEventListener('touchstart', playAestheticAudio, { once: true, passive: true });
    window.addEventListener('pointerdown', playAestheticAudio, { once: true });
    window.addEventListener('click', playAestheticAudio, { once: true });
    window.addEventListener('scroll', playAestheticAudio, { once: true });
  </script>
</body>
</html>
