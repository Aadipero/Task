<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AXY - Easy Task Grab Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #06050e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      color: #ffffff;
      overflow-x: hidden;
      perspective: 1000px;
      position: relative;
    }

    /* Multi-layered Neon Ambient Aura */
    .glow-sphere-1 {
      position: fixed;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(139, 92, 246, 0.08) 50%, transparent 75%);
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(65px);
      z-index: 0;
      pointer-events: none;
      animation: floatAura 6s ease-in-out infinite alternate;
    }

    .glow-sphere-2 {
      position: fixed;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.16) 0%, transparent 70%);
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }

    @keyframes floatAura {
      0% { transform: translate(-50%, -46%) scale(0.95); }
      100% { transform: translate(-50%, -54%) scale(1.1); }
    }

    /* Sound Unlocker Prompt Barrier */
    .audio-gate {
      position: fixed;
      inset: 0;
      background: rgba(5, 4, 12, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .gate-btn {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(234, 179, 8, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.35);
      animation: gatePulse 1.8s infinite ease-in-out;
    }

    @keyframes gatePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(168, 85, 247, 0.35); }
      50% { transform: scale(1.06); box-shadow: 0 15px 45px rgba(234, 179, 8, 0.45); }
    }

    /* Main Futuristic Card */
    .card {
      position: relative;
      background: linear-gradient(170deg, rgba(30, 24, 52, 0.94) 0%, rgba(13, 11, 24, 0.98) 100%);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 32px;
      width: 100%;
      max-width: 350px;
      padding: 38px 24px 28px;
      text-align: center;
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      z-index: 10;
      transform-style: preserve-3d;
      box-shadow: 
        0 35px 70px rgba(0, 0, 0, 0.85),
        0 0 70px rgba(168, 85, 247, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: transform 0.25s ease-out;
    }

    /* Floating Status Badge */
    .floating-popup {
      position: absolute;
      top: -14px;
      right: 18px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 50px;
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.5);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
    }

    .floating-popup span {
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
      animation: blinkDot 1.4s infinite alternate;
    }

    @keyframes blinkDot {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* 3D Glowing Avatar Ring */
    .avatar-wrapper {
      position: relative;
      width: 136px;
      height: 136px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6, #06b6d4, #f59e0b);
      background-size: 300% 300%;
      animation: shiftGrad 5s linear infinite;
      box-shadow: 
        0 18px 40px rgba(139, 92, 246, 0.5),
        0 0 50px rgba(236, 72, 153, 0.25);
    }

    @keyframes shiftGrad {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #0f0e17;
      border: 3.5px solid #0f0e17;
    }

    /* Active Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.45);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .badge span {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 12px #22c55e;
    }

    h1 {
      font-size: 25px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 26px;
      padding: 0 6px;
    }

    /* Start Task 3D Golden CTA Button */
    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 18px;
      background: linear-gradient(135deg, #fde047 0%, #eab308 55%, #ca8a04 100%);
      color: #000000;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      border-radius: 18px;
      box-shadow: 
        0 14px 28px rgba(234, 179, 8, 0.45),
        0 5px 0 #a16207,
        inset 0 1.5px 0 rgba(255, 255, 255, 0.6);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .cta-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 12px rgba(234, 179, 8, 0.35), 0 1px 0 #a16207;
    }

    .cta-btn svg {
      width: 22px;
      height: 22px;
      fill: #000000;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Background Auras -->
  <div class="glow-sphere-1"></div>
  <div class="glow-sphere-2"></div>

  <!-- Sound Unlock Overlay (Guarantees Sound on Chrome/Mobile) -->
  <div class="audio-gate" id="audioGate">
    <div class="gate-btn">
      ✨ Tap Anywhere to Enter
    </div>
    <span style="font-size: 12px; color: #94a3b8;">Headphones Recommended 🎧</span>
  </div>

  <div class="card" id="card">
    <div class="floating-popup">
      <span></span> New Task
    </div>

    <div class="avatar-wrapper">
      <img src="dp.jpg" alt="Logo" class="avatar-img" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80'">
    </div>

    <div class="badge">
      <span></span> Active Task Available
    </div>

    <h1>Easy Task Grab Now</h1>
    <p class="subtitle">Click below to start your task directly on Telegram and get your details instantly.</p>

    <!-- Bot URL with auto /start command -->
    <a href="https://t.me/Agent_alinaNSE_bot?start=start" class="cta-btn" id="taskBtn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
      </svg>
      Start Task Now
    </a>

    <div class="footer-note">
      Fast & direct verification
    </div>
  </div>

  <script>
    let audioUnlocked = false;

    // Aesthetic Chill Sine Harmony
    function playAestheticSwell() {
      if (audioUnlocked) return;
      audioUnlocked = true;

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        // Dreamy ambient chords (Eb Major Pentatonic - Soft and Aesthetic)
        const notes = [
          { f: 311.13, delay: 0.0, len: 2.2 }, // Eb4
          { f: 466.16, delay: 0.15, len: 2.4 }, // Bb4
          { f: 622.25, delay: 0.32, len: 2.6 }, // Eb5
          { f: 932.33, delay: 0.50, len: 3.0 }, // Bb5
          { f: 1244.51, delay: 0.68, len: 3.2 } // Eb6
        ];

        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(note.f, ctx.currentTime + note.delay);

          gain.gain.setValueAtTime(0.0001, ctx.currentTime + note.delay);
          gain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + note.delay + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + note.delay + note.len);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + note.delay);
          osc.stop(ctx.currentTime + note.delay + note.len + 0.1);
        });
      } catch (err) {
        console.warn("Audio Context init blocked:", err);
      }

      // Hide gate overlay smoothly
      const gate = document.getElementById('audioGate');
      gate.style.opacity = '0';
      setTimeout(() => { gate.style.display = 'none'; }, 500);
    }

    // Direct Unlock on gate tap (Bypasses Chrome restrictions 100%)
    document.getElementById('audioGate').addEventListener('pointerdown', playAestheticSwell);
    document.getElementById('audioGate').addEventListener('click', playAestheticSwell);

    // 3D Card Interactive Tilt
    const cardEl = document.getElementById('card');
    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const rotateX = (window.innerHeight / 2 - touch.clientY) / 20;
      const rotateY = (touch.clientX - window.innerWidth / 2) / 20;
      cardEl.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      cardEl.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });
  </script>

</body>
</html>
