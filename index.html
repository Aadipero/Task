<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXY - Easy Task Grab Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #1f1b2e 0%, #0c0b10 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #ffffff;
    }

    .card {
      background: rgba(22, 20, 32, 0.85);
      border: 1px solid rgba(255, 215, 0, 0.25);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 35px rgba(234, 179, 8, 0.12);
      border-radius: 28px;
      width: 100%;
      max-width: 390px;
      padding: 34px 24px;
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 24px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #111;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .badge span {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #000000;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(234, 179, 8, 0.35);
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(234, 179, 8, 0.45);
      background: linear-gradient(135deg, #facc15 0%, #d97706 100%);
    }

    .cta-btn:active {
      transform: translateY(1px);
    }

    .cta-btn svg {
      width: 22px;
      height: 22px;
      fill: #000000;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrapper">
      <img src="dp.jpg" alt="AXY Logo" class="avatar-img" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80'">
    </div>

    <div class="badge">
      <span></span> Active Task Available
    </div>

    <h1>Easy Task Grab Now</h1>
    <p class="subtitle">Click below to connect directly on Telegram and receive complete task details instantly.</p>

    <!-- Exact prefilled message set to @AxY_manager -->
    <a href="https://t.me/AxY_manager?text=Hello%20Mam,%0ASend%20Me%20Your%20Work%20Details" class="cta-btn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24">

      </svg>
      Telegram Now
    </a>

    <div class="footer-note">
      Fast & direct verification
    </div>
  </div>

</body>
</html>
