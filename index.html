<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AXY - Easy Task Grab Now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #05040a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Dark Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(30, 20, 60, 0.55), rgba(5, 4, 10, 0.9));
      backdrop-filter: blur(6px);
      z-index: 1;
    }

    /* Ambient Glow */
    body::before {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.14) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }

    /* Main Card */
    .card {
      position: relative;
      background: linear-gradient(160deg, rgba(32, 28, 50, 0.96), rgba(16, 14, 26, 0.98));
      border: 1px solid rgba(255, 215, 0, 0.28);
      border-radius: 28px;
      width: 100%;
      max-width: 360px;
      padding: 32px 22px 26px;
      text-align: center;
      backdrop-filter: blur(20px);
      z-index: 10;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 60px rgba(234, 179, 8, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: popupIn 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      transform: scale(0.75) translateY(30px);
    }

    @keyframes popupIn {
      0% {
        opacity: 0;
        transform: scale(0.75) translateY(30px);
      }
      70% {
        opacity: 1;
        transform: scale(1.03) translateY(-6px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card:hover {
      transform: translateY(-8px) scale(1.015);
      box-shadow: 
        0 35px 60px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 0 80px rgba(234, 179, 8, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.35s ease;
    }

    /* Floating New Task Badge */
    .floating-popup {
      position: absolute;
      top: -14px;
      right: 16px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4);
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 20;
      animation: floatPopup 3s ease-in-out infinite;
    }

    @keyframes floatPopup {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .floating-popup span {
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    /* Avatar */
    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6, #f59e0b);
      background-size: 300% 300%;
      animation: gradientShift 6s ease infinite;
      box-shadow: 
        0 14px 32px rgba(245, 158, 11, 0.4),
        0 0 0 6px rgba(245, 158, 11, 0.09);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #111;
      border: 3px solid #0f0e17;
    }

    .avatar-wrapper::after {
      content: '';
      position: absolute;
      inset: -11px;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 158, 11, 0.28);
      animation: pulseRing 2.8s ease-in-out infinite;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(1.08); opacity: 0.15; }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(234, 179, 8, 0.08));
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.18);
    }

    .badge span {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: blink 1.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 10%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    /* Button */
    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 18px;
      background: linear-gradient(135deg, #facc15 0%, #eab308 45%, #ca8a04 100%);
      color: #000000;
      font-size: 15.5px;
      font-weight: 800;
      text-decoration: none;
      border-radius: 16px;
      letter-spacing: 0.3px;
      border: none;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 
        0 10px 24px rgba(234, 179, 8, 0.4),
        0 4px 0 #a16207,
        inset 0 2px 0 rgba(255, 255, 255, 0.4);
      transition: all 0.25s ease;
    }

    .cta-btn:hover {
      transform: translateY(-3px);
      box-shadow: 
        0 14px 30px rgba(234, 179, 8, 0.5),
        0 5px 0 #a16207,
        inset 0 2px 0 rgba(255, 255, 255, 0.5);
      background: linear-gradient(135deg, #fde047 0%, #facc15 45%, #eab308 100%);
    }

    .cta-btn:active {
      transform: translateY(2px);
      box-shadow: 
        0 6px 14px rgba(234, 179, 8, 0.35),
        0 2px 0 #a16207,
        inset 0 2px 0 rgba(255, 255, 255, 0.3);
    }

    .cta-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      transform: skewX(-20deg);
      transition: 0.55s;
    }

    .cta-btn:hover::before {
      left: 140%;
    }

    .cta-btn svg {
      width: 20px;
      height: 20px;
      fill: #000000;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="card">
    <!-- Floating Badge -->
    <div class="floating-popup">
      <span></span> New Task
    </div>

    <!-- Avatar (dp.jpg yahan lagega) -->
    <div class="avatar-wrapper">
      <img src="dp.jpg" alt="AXY Logo" class="avatar-img" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80'">
    </div>

    <!-- Active Badge -->
    <div class="badge">
      <span></span> Active Task Available
    </div>

    <!-- Heading -->
    <h1>Easy Task Grab Now</h1>
    <p class="subtitle">Click below to connect directly on Telegram and receive complete task details instantly.</p>

    <!-- Telegram Button -->
    <a href="https://t.me/AxY_manager?text=Hello%20Sir,%20Send%20Me%20Work%20Details" class="cta-btn" target="_blank" rel="noopener noreferrer">

      </svg>
      Telegram Now
    </a>

    <div class="footer-note">
      Fast & direct verification
    </div>
  </div>

</body>
</html>
